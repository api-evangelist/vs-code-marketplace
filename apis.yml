name: VS Code Marketplace
description: >-
  VS Code Marketplace is Microsoft's official extension marketplace for Visual Studio Code, offering thousands of
  extensions for languages, debuggers, themes, and developer tools. It provides a Gallery API for programmatically
  searching, discovering, and retrieving extension metadata, enabling integration with editors, tooling, and automation
  workflows.
